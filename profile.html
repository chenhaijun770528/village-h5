<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>个人中心 - 村庄平台</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;background:#f5f5f5;color:#333;font-size:14px}.header{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#2E7D32,#4CAF50);color:#fff;padding:12px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}.header-title{font-size:18px;font-weight:bold}.header-back{font-size:20px;cursor:pointer;padding:4px 8px}.container{padding:60px 16px 80px;max-width:750px;margin:0 auto}.user-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px}.user-avatar{font-size:52px}.user-info{flex:1}.user-name{font-size:17px;font-weight:bold;color:#222}.user-account{font-size:12px;color:#999;margin-top:3px}.role-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:6px}.role-none{background:#f5f5f5;color:#999}.role-active{background:#E8F5E9;color:#2E7D32}.role-pending{background:#FFF3E0;color:#E65100}.role-rejected{background:#ffebee;color:#c62828}.section-title{font-size:14px;font-weight:bold;color:#888;margin-bottom:10px;padding-left:4px}.menu-list{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}.menu-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}.menu-item:active{background:#f9f9f9}.menu-item:last-child{border-bottom:none}.menu-icon{font-size:22px;margin-right:12px}.menu-text{flex:1;font-size:15px;color:#333}.menu-arrow{font-size:18px;color:#ccc}.village-panel{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.audit-item{border:1px solid #e8e8e8;border-radius:10px;padding:12px;margin-bottom:10px;border-left:4px solid #FF9800}.audit-name{font-size:14px;font-weight:bold;color:#333}.audit-info{font-size:12px;color:#888;margin:3px 0}.audit-actions{display:flex;gap:8px;margin-top:8px}.audit-actions button{flex:1;padding:6px;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer}.btn-a-approve{background:#4CAF50;color:#fff}.btn-a-reject{background:#F44336;color:#fff}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}.modal-box{background:#fff;border-radius:14px;padding:20px;width:92%;max-width:500px;max-height:80vh;overflow-y:auto}.modal-input{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box}.modal-textarea{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;height:80px;resize:vertical;box-sizing:border-box}.modal-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:8px}.modal-btn-save{background:#2E7D32;color:#fff}.modal-btn-cancel{background:#f5f5f5;color:#666;margin-top:6px}.empty-state{text-align:center;padding:28px;color:#bbb;font-size:14px}.pending-notice{background:#FFF8E1;border-radius:10px;padding:12px 14px;font-size:13px;color:#795548;margin-bottom:16px;line-height:1.6}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 28px;border-radius:10px;font-size:14px;z-index:9999;pointer-events:none}</style></head><body><div class="header"><span class="header-back" onclick="history.back()">&#x2190;</span><span class="header-title">个人中心</span><span style="width:40px"></span></div><div class="container" id="mainContent">加载中...</div><div id="editContactModal" class="modal-overlay" style="display:none"><div class="modal-box"><div class="modal-title">编辑联系方式</div><div class="modal-form-group"><label class="modal-label">* 联系电话</label><input type="tel" id="editPhone" class="modal-input" placeholder="请输入手机号码" maxlength="11"></div><div class="modal-form-group"><label class="modal-label">收货地址</label><textarea id="editAddress" class="modal-textarea" placeholder="请输入收货地址"></textarea></div><button class="modal-btn modal-btn-save" onclick="saveContactInfo()">保存</button><button class="modal-btn modal-btn-cancel" onclick="closeEditContactModal()">取消</button></div></div><script>function g(k,d){try{var v=localStorage.getItem("village_"+k);return v?JSON.parse(v):d}catch(e){return d}}function s(k,v){localStorage.setItem("village_"+k,JSON.stringify(v))}function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2000)}var user=g("user");if(!user){location.href="login.html"}var roleMap={"村主任":"township","村民":"villager","游客":"tourist","超市老板":"market","建筑公司":"construction","老师":"teacher","大学生":"student","律师":"lawyer","货运司机":"truck","顺风车":"carpool","按摩师":"massage","按摩技师":"massage","建筑园林师":"landscape"};var roleNames={"township":"村主任","villager":"村民","tourist":"游客","market":"超市老板","construction":"建筑公司","teacher":"老师","student":"大学生","lawyer":"律师","truck":"货运司机","carpool":"顺风车","massage":"按摩技师","landscape":"建筑园林设计师"};var roleIcons={"township":"👔","villager":"🏠","tourist":"🎒","market":"🏪","construction":"🏗️","teacher":"📚","student":"🎓","lawyer":"⚖️","truck":"🚛","carpool":"🚗","massage":"💆","landscape":"🌿"};function render(){var regs=g("registrations",[]);var myRegs=regs.filter(function(r){return r.accountId===user.id});var pendingV=[];if(user.currentRole==="township"){pendingV=regs.filter(function(r){return(r.role==="村民"||r.role==="villager")&&r.status==="待审核"})}var roleLabel="<span class='role-badge role-none'>❓ 未选择角色</span>";if(user.currentRole&&user.currentRole!=="none"){var ri=user.currentRole;roleLabel="<span class='role-badge role-active'>"+(roleIcons[ri]||"👤")+" "+(roleNames[ri]||ri)+"</span>"}var html="";html+="<div class='user-card'><div class='user-avatar'>👤</div><div class='user-info'><div class='user-name'>"+user.account+"</div><div class='user-account'>账号："+user.account+"</div>";if(user.phone)html+="<div style='font-size:12px;color:#666;margin-top:4px;'>📞 "+user.phone+"</div>";if(user.address)html+="<div style='font-size:12px;color:#666;margin-top:2px;'>📍 "+(user.address.length>15?user.address.substring(0,15)+"...":user.address)+"</div>";html+=roleLabel+"<button onclick='openEditContactModal()' style='margin-top:8px;padding:6px 12px;background:#4CAF50;color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;width:100%;'>✏️ 编辑联系方式</button></div></div>";if(myRegs.length>0){var lr=myRegs[0];if(lr.status==="待审核")html+="<div class='pending-notice'>⏳ 您的「"+lr.role+"」申请正在审核中，请耐心等待。<br>审核通过后您将自动获得相应功能权限。</div>";else if(lr.status==="已拒绝")html+="<div class='pending-notice'>❌ 您的「"+lr.role+"」申请已被拒绝，如有疑问请联系管理员。</div>"}if(user.currentRole==="township"){var villages=g("villages",[]);var myV=null;for(var vi=0;vi<villages.length;vi++){if(villages[vi].chief&&villages[vi].chief.name===user.account){myV=villages[vi];break}}if(myV)pendingV=pendingV.filter(function(r){return r.village===myV.name});if(!myV){html+="<div class='village-panel'><div class='village-panel-title'>🏘️ 我的村庄</div><div style='text-align:center;padding:10px 0;'><div style='font-size:48px;margin-bottom:8px;'>🏡</div><div style='font-size:14px;color:#888;margin-bottom:12px;'>您还没有村庄信息</div><button onclick='openVillageModal(true)' style='padding:10px 24px;background:#2E7D32;color:white;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;'>创建村庄</button></div></div>"}else{html+="<div class='village-panel'><div class='village-panel-title'>🏘️ 我的村庄「"+myV.name+"」</div><div style='font-size:13px;color:#666;margin-bottom:12px;'>📍 "+(myV.province||"")+" "+(myV.city||"")+"<br>📞 村长："+myV.chief.name+" "+(myV.chief.phone||"")+"<br>👥 人口："+(myV.population||"待完善")+" 人<br>📐 总面积："+(myV.totalArea||"待完善")+" 亩 | 农田："+(myV.farmlandArea||"待完善")+" 亩<br>"+(myV.description?"📝 "+myV.description+"<br>":"")+"</div><button onclick='openVillageModal(false)' style='width:100%;padding:10px;background:#2E7D32;color:white;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:8px;'>✏️ 编辑村庄信息</button></div>"}html+="<div class='village-panel' id='auditPanel'><div class='village-panel-title'>👥 村民加入审核";if(pendingV.length>0)html+=" <span style='background:#F44336;color:white;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:bold;'>"+pendingV.length+"</span>";html+="</div>";if(pendingV.length===0){html+="<div class='empty-state'>暂无待审核的村民申请</div>"}else{for(var pi=0;pi<pendingV.length;pi++){var p=pendingV[pi];html+="<div class='audit-item'><div class='audit-name'>🏠 "+(p.name||"未知")+"</div><div class='audit-info'>村庄："+(p.village||"未知")+" | 手机："+(p.phone||"未知")+"</div><div class='audit-info'>申请时间："+(p.applyTime?new Date(p.applyTime).toLocaleDateString("zh-CN"):"")+"</div><div class='audit-actions'><button class='btn-a-approve' data-id='"+p.id+"'>✅ 通过</button><button class='btn-a-reject' data-id='"+p.id+"'>❌ 拒绝</button></div></div>"}}html+="</div>"}html+="<div class='section-title'>快捷功能</div><div class='menu-list'><div class='menu-item' onclick='location.href=\"select-role.html\"'><span class='menu-icon'>🎯</span><span class='menu-text'>选择/注册角色</span><span class='menu-arrow'>›</span></div><div class='menu-item' onclick='location.href=\"index.html\"'><span class='menu-icon'>🏠</span><span class='menu-text'>返回首页</span><span class='menu-arrow'>›</span></div></div>";if(myRegs.length>0){html+="<div class='section-title'>我的注册</div><div class='menu-list'>";myRegs.forEach(function(r){var sc=r.status==="已通过"?"role-active":(r.status==="已拒绝"?"role-rejected":"role-pending");var si=r.status==="已通过"?"✅":(r.status==="已拒绝"?"❌":"⏳");var ic=roleIcons[roleMap[r.role]]||"👤";html+="<div class='menu-item'><span class='menu-icon'>"+ic+"</span><span class='menu-text'>"+(roleNames[roleMap[r.role]]||r.role)+" - "+(r.name||"")+"</span><span class='role-badge "+sc+"'>"+si+" "+r.status+"</span></div>"});html+="</div>"}html+="<div style='margin-top:16px;'><button class='btn-logout' onclick='doLogout()' style='width:100%;padding:13px;background:#fff;color:#F44336;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)'>🚪 退出登录</button></div>";document.getElementById("mainContent").innerHTML=html}document.addEventListener("click",function(e){var t=e.target;if(t.classList.contains("btn-a-approve")){var id=t.getAttribute("data-id");var r=g("registrations",[]);for(var i=0;i<r.length;i++){if(r[i].id===id){r[i].status="已通过";break}}s("registrations",r);toast("已通过！");render()}if(t.classList.contains("btn-a-reject")){if(!confirm("确定拒绝？"))return;var id=t.getAttribute("data-id");var r=g("registrations",[]);for(var i=0;i<r.length;i++){if(r[i].id===id){r[i].status="已拒绝";break}}s("registrations",r);toast("已拒绝");render()}});window.openVillageModal=function(isCreate){var vs=g("villages",[]);var d=null;if(!isCreate){for(var i=0;i<vs.length;i++){if(vs[i].chief&&vs[i].chief.name===user.account){d=vs[i];break}}}var dm=d||{};var m="<div class='modal-overlay' onclick='closeVillageModal(event)'><div class='modal-box' onclick='event.stopPropagation()'><div class='modal-title'>"+(isCreate?"🏡 创建村庄":"✏️ 编辑村庄信息")+"</div>";m+="<div class='modal-form-group'><label class='modal-label'>* 村庄名称</label><input class='modal-input' id='vf_name' value='"+(dm.name||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>省份</label><input class='modal-input' id='vf_province' value='"+(dm.province||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>城市</label><input class='modal-input' id='vf_city' value='"+(dm.city||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>人口</label><input class='modal-input' id='vf_population' value='"+(dm.population||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>总面积亩</label><input class='modal-input' id='vf_totalArea' value='"+(dm.totalArea||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>农田面积亩</label><input class='modal-input' id='vf_farmlandArea' value='"+(dm.farmlandArea||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>村长电话</label><input class='modal-input' id='vf_phone' value='"+((dm.chief&&dm.chief.phone)||"")+"'></div>";m+="<div class='modal-form-group'><label class='modal-label'>简介</label><textarea class='modal-textarea' id='vf_description'>"+(dm.description||"")+"</textarea></div>";m+="<button class='modal-btn modal-btn-save' onclick='saveVillage()'>保存</button><button class='modal-btn modal-btn-cancel' onclick='closeVillageModal()'>取消</button></div></div>";var w=document.createElement("div");w.innerHTML=m;document.body.appendChild(w)};window.closeVillageModal=function(e){if(e&&e.target&&e.target.className!=="modal-overlay")return;var m=document.querySelector(".modal-overlay");if(m)m.remove()};window.saveVillage=function(){var n=document.getElementById("vf_name").value.trim();if(!n){toast("请输入村庄名称");return}var vs=g("villages",[]);var p=document.getElementById("vf_province").value.trim();var c=document.getElementById("vf_city").value.trim();var pop=document.getElementById("vf_population").value.trim();var ta=document.getElementById("vf_totalArea").value.trim();var fa=document.getElementById("vf_farmlandArea").value.trim();var ph=document.getElementById("vf_phone").value.trim();var desc=document.getElementById("vf_description").value.trim();vs.push({id:"v_"+Date.now(),name:n,province:p,city:c,population:pop,totalArea:ta,farmlandArea:fa,description:desc,chief:{name:user.account,phone:ph},images:[],scenery:[],createTime:Date.now()});s("villages",vs);toast("村庄创建成功！");closeVillageModal();render()};window.openEditContactModal=function(){document.getElementById("editPhone").value=user.phone||"";document.getElementById("editAddress").value=user.address||"";document.getElementById("editContactModal").style.display="flex"};window.closeEditContactModal=function(){document.getElementById("editContactModal").style.display="none"};window.saveContactInfo=function(){var ph=document.getElementById("editPhone").value.trim();var addr=document.getElementById("editAddress").value.trim();if(!ph||!/^1[3-9]\d{9}$/.test(ph)){toast("请输入正确手机号");return}user.phone=ph;user.address=addr;s("user",user);var a=g("accounts",[]);for(var i=0;i<a.length;i++){if(a[i].id===user.id){a[i].phone=ph;a[i].address=addr;break}}s("accounts",a);closeEditContactModal();toast("保存成功！");render()};window.doLogout=function(){if(!confirm("确定退出登录？"))return;s("user",null);location.href="login.html"};render();</script></body></html>
