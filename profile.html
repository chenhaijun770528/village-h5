<script>
(function(){
"use strict";
// 全局存储封装
const Storage = {
 get(key, defaultVal) {
 try {
 const v = localStorage.getItem('village_' + key);
 return v ? JSON.parse(v) : defaultVal;
 } catch(e) { return defaultVal; }
 },
 set(key, val) {
 localStorage.setItem('village_' + key, JSON.stringify(val));
 }
};

// 登录鉴权
let currentUser = Storage.get('user', null);
if (!currentUser) {
 location.href = 'login.html';
}

// 角色兼容：旧对象格式转为字符串
if (currentUser && currentUser.currentRole && typeof currentUser.currentRole === 'object') {
 const roleMap = { 'head': 'township','villager': 'villager','tourist': 'tourist' };
 const newRole = roleMap[currentUser.currentRole.role] || currentUser.currentRole.role || 'none';
 currentUser.currentRoleName = currentUser.currentRole.roleName || currentUser.currentRoleName || '';
 currentUser.currentRole = newRole;
 Storage.set('user', currentUser);
}

// 从已通过注册记录同步角色
if (!currentUser.currentRole || currentUser.currentRole === 'none') {
 const _regs = Storage.get('registrations', []);
 const _roleMap = {
 '村主任':'township','村民':'villager','游客':'tourist',
 '超市老板':'market','建筑公司':'construction','老师':'teacher',
 '大学生':'student','律师':'lawyer','货运司机':'truck','顺风车':'carpool',
 '按摩师':'massage','按摩技师':'massage','建筑园林师':'landscape'
 };
 for (let _i = 0; _i < _regs.length; _i++) {
 if (_regs[_i].accountId === currentUser.id && _regs[_i].status === '已通过') {
 const _rid = _roleMap[_regs[_i].role] || 'tourist';
 currentUser.currentRole = _rid;
 Storage.set('user', currentUser);
 const _accs = Storage.get('accounts', []);
 for (let _j = 0; _j < _accs.length; _j++) {
 if (_accs[_j].id === currentUser.id) { _accs[_j].currentRole = _rid; break; }
 }
 Storage.set('accounts', _accs);
 break;
 }
 }
}

const ROLES_MAP = {
 'township': { icon: '👔', name: '村主任', color: '#2E7D32' },
 'villager': { icon: '🏠', name: '村民', color: '#4CAF50' },
 'tourist': { icon: '🎒', name: '游客', color: '#2196F3' },
 'market': { icon: '🏪', name: '超市老板', color: '#FF9800' },
 'construction': { icon: '🏗️', name: '建筑公司', color: '#795548' },
 'teacher': { icon: '📚', name: '老师', color: '#9C27B0' },
 'student': { icon: '🎓', name: '大学生', color: '#00BCD4' },
 'lawyer': { icon: '⚖️', name: '律师', color: '#607D8B' },
 'truck': { icon: '🚛', name: '货运司机', color: '#8D6E63' },
 'carpool': { icon: '🚗', name: '顺风车', color: '#009688' },
 'massage': { icon: '💆', name: '按摩技师', color: '#E91E63' },
 'landscape': { icon: '🌿', name: '建筑园林设计师', color: '#795548' }
};

// Toast 轻提示
function toast(msg) {
 const el = document.createElement('div');
 el.className = 'toast';
 el.textContent = msg;
 document.body.appendChild(el);
 setTimeout(()=>el.remove(), 2000);
}

// 全局错误捕获
window.onerror = function(msg, url, line, col, error) {
 const errorEl = document.getElementById('mainContent');
 if (errorEl) {
 errorEl.innerHTML = '<div style="padding:20px;color:red;word-break:break-all;background:#fff;">' +
 '<h3>页面运行错误，请截图给开发者</h3>' +
 '<p><b>错误：</b>' + msg + '</p>' +
 '<p><b>位置：</b>行 ' + line + (col ? ', 列 ' + col : '') + '</p>' +
 '<p><b>堆栈：</b>' + (error && error.stack ? error.stack.toString().substring(0, 800) : '无') + '</p>' +
 '</div>';
 }
 return false;
};

// 渲染主页面
function renderPage() {
 const mainEl = document.getElementById('mainContent');
 const role = ROLES_MAP[currentUser.currentRole] || null;
 let roleTag = '<span class="role-badge role-none">❓ 未选择角色</span>';
 if (currentUser.currentRole && currentUser.currentRole !== 'none' && role) {
 roleTag = '<span class="role-badge role-active">' + role.icon + ' ' + role.name + '</span>';
 }

 // 我的注册记录
 const regs = Storage.get('registrations', []);
 const myRegs = regs.filter(r=>r.accountId === currentUser.id);

 // 村主任待审核村民申请
 let pendingForMe = [];
 if (currentUser.currentRole === 'township') {
 pendingForMe = regs.filter(r=>r.role === '村民' && r.status === '待审核');
 }

 let html = '';
 // 用户信息卡片
 html += '<div class="user-card">' +
 '<div class="user-avatar">👤</div>' +
 '<div class="user-info">' +
 '<div class="user-name">' + currentUser.account + '</div>' +
 '<div class="user-account">账号：' + currentUser.account + '</div>' +
 (currentUser.phone ? '<div style="font-size:12px;color:#666;margin-top:4px;">📞 ' + currentUser.phone + '</div>' : '') +
 (currentUser.address ? '<div style="font-size:12px;color:#666;margin-top:2px;">📍 ' + (currentUser.address.length > 15 ? currentUser.address.substring(0, 15) + '...' : currentUser.address) + '</div>' : '') +
 roleTag +
 '<button onclick="openEditContactModal()" style="margin-top:8px;padding:6px 12px;background:#4CAF50;color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;width:100%;">✏️ 编辑联系方式</button>' +
 '</div></div>';

 // 审核状态提示
 if(myRegs.length > 0){
 const latestReg = myRegs[0];
 if(latestReg.status === '待审核'){
 html += '<div class="pending-notice">⏳ 您的「' + latestReg.role + '」申请正在审核中，请耐心等待。<br>审核通过后您将自动获得相应功能权限。</div>';
 }else if(latestReg.status === '已拒绝'){
 html += '<div class="pending-notice">❌ 您的「' + latestReg.role + '」申请已被拒绝，如有疑问请联系管理员。</div>';
 }
 }

 // 村主任：我的村庄
 let myVillage = null;
 if(currentUser.currentRole === 'township'){
 const villages = Storage.get('villages', []);
 function findMyVillage(vills, user) {
 if (!user || !vills || !vills.length) return null;
 for(let i=0;i<vills.length;i++){
 if(vills[i].chief && vills[i].chief.name === user.currentRoleName) return vills[i];
 }
 for(let i=0;i<vills.length;i++){
 if(vills[i].chief && vills[i].chief.name === user.account) return vills[i];
 }
 for(let i=0;i<vills.length;i++){
 if(vills[i].chief && vills[i].chief.phone === user.phone) return vills[i];
 }
 if(vills.length === 1 && user.currentRole === 'township') return vills[0];
 return null;
 }
 myVillage = findMyVillage(villages, currentUser);
 // 过滤本村村民申请
 if(myVillage){
 pendingForMe = pendingForMe.filter(r=>r.village === myVillage.name);
 }
 if(!myVillage){
 html += '<div class="village-panel">' +
 '<div class="village-panel-title">🏘️ 我的村庄</div>' +
 '<div style="text-align:center;padding:10px 0;">' +
 '<div style="font-size:48px;margin-bottom:8px;">🏡</div>' +
 '<div style="font-size:14px;color:#888;margin-bottom:12px;">您还没有村庄信息</div>' +
 '<button onclick="openVillageModal(true)" style="padding:10px 24px;background:#2E7D32;color:white;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;">创建村庄</button>' +
 '</div></div>';
 }else{
 html += '<div class="village-panel">' +
 '<div class="village-panel-title">🏘️ 我的村庄「' + myVillage.name + '」</div>' +
 '<div style="font-size:13px;color:#666;margin-bottom:12px;">' +
 '📍 ' + (myVillage.province || '') + ' ' + (myVillage.city || '') + '<br>' +
 '📞 村长：' + (myVillage.chief ? myVillage.chief.name : '未知') + ' ' + (myVillage.chief ? myVillage.chief.phone : '') + '<br>' +
 '👥 人口：' + (myVillage.population || '待完善') + ' 人<br>' +
 '📐 总面积：' + (myVillage.totalArea || '待完善') + ' 亩 | 农田：' + (myVillage.farmlandArea || '待完善') + ' 亩<br>' +
 '🏠 地址：' + (myVillage.address || '待完善') + '<br>' +
 (myVillage.description ? '📝 ' + myVillage.description + '<br>' : '') +
 ((myVillage.images && myVillage.images.length) ? '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">' + myVillage.images.map(function(img){ return '<img src="' + img + '" style="width:60px;height:60px;object-fit:cover;border-radius:8px;">'; }).join('') + '</div>' : '') +
 '</div>' +
 '<button onclick="openVillageModal(false)" style="width:100%;padding:10px;background:#2E7D32;color:white;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:8px;">✏️ 编辑村庄信息</button>' +
 '</div>';
 }

 // 村民审核面板
 html += '<div class="village-panel">' +
 '<div class="village-panel-title">👥 村民加入审核' +
 (pendingForMe.length > 0 ? ' <span style="background:#F44336;color:white;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:bold;">' + pendingForMe.length + '</span>' : '') +
 '</div>';
 if(pendingForMe.length === 0){
 html += '<div class="empty-state">暂无待审核的村民申请</div>';
 }else{
 pendingForMe.forEach(function(p){
 html += '<div class="audit-item">' +
 '<div class="audit-name">🏠 ' + (p.name||'未知') + '</div>' +
 '<div class="audit-info">村庄：' + (p.village||'未知') + ' | 手机：' + (p.phone||'未知') + '</div>' +
 '<div class="audit-info">申请时间：' + (p.applyTime ? new Date(p.applyTime).toLocaleDateString('zh-CN') : '') + '</div>' +
 '<div class="audit-actions">' +
 '<button class="btn-a-approve" onclick="approveVillager('' + p.id + '')">✅ 通过</button>' +
 '<button class="btn-a-reject" onclick="rejectVillager('' + p.id + '')">❌ 拒绝</button>' +
 '</div></div>';
 });
 }
 html += '</div>';

 // 产品上架审核
 const pendingProducts = Storage.get('product_applications', [])
 .filter(function(p){ return (p.status === '待审核' || p.status === 'waiting') && (!myVillage || p.village === myVillage.name || p.village === ''); });
 const pendingFood = Storage.get('food_applications', [])
 .filter(function(f){ return (f.status === '待审核' || f.status === 'waiting') && (!myVillage || f.villageId === myVillage.id); });
 const pendingCamps = Storage.get('camp_applications', [])
 .filter(function(c){ return (c.status === '待审核' || c.status === 'waiting') && (!myVillage || c.villageId === myVillage.id); });
 const totalPending = pendingProducts.length + pendingFood.length + pendingCamps.length;

 html += '<div class="village-panel">' +
 '<div class="village-panel-title">✅ 产品上架审核' +
 (totalPending > 0 ? ' <span style="background:#F44336;color:white;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:bold;">' + totalPending + '</span>' : '') +
 '</div>' +
 '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">' +
 '<div onclick="auditProducts()" style="text-align:center;padding:12px;background:#FFF3E0;border-radius:8px;cursor:pointer;">' +
 '<div style="font-size:24px;">🥬</div>' +
 '<div style="font-size:12px;color:#E65100;margin-top:4px;">农产品' + (pendingProducts.length > 0 ? ' (' + pendingProducts.length + ')' : '') + '</div></div>' +
 '<div onclick="auditFoods()" style="text-align:center;padding:12px;background:#FFF3E0;border-radius:8px;cursor:pointer;">' +
 '<div style="font-size:24px;">🍜</div>' +
 '<div style="font-size:12px;color:#E65100;margin-top:4px;">美食' + (pendingFood.length > 0 ? ' (' + pendingFood.length + ')' : '') + '</div></div>' +
 '<div onclick="auditCamps()" style="text-align:center;padding:12px;background:#FFF3E0;border-radius:8px;cursor:pointer;">' +
 '<div style="font-size:24px;">🏕️</div>' +
 '<div style="font-size:12px;color:#E65100;margin-top:4px;">露营' + (pendingCamps.length > 0 ? ' (' + pendingCamps.length + ')' : '') + '</div></div>' +
 '</div></div>';
 }

 // 下面部分 - 村民模块、技师模块、菜单、退出 等在第二个 script 块中
 // 这里被截断了，用户的代码应该完整
}());

// 为了让 HTML onclick 能访问，全局导出
var APP = {
 user: currentUser,
 toast: toast,
 renderPage: renderPage,
 Storage: Storage,
 ROLES_MAP: ROLES_MAP
};

// ===================== 业务函数 =====================
// 村民审核
window.approveVillager = function(regId) {
 var regs = APP.Storage.get('registrations', []);
 for(var i=0;i<regs.length;i++){
 if(regs[i].id === regId){
 regs[i].status = '已通过';
 regs[i].reviewTime = Date.now();
 break;
 }
 }
 APP.Storage.set('registrations', regs);
 APP.toast('已通过！该村民已激活');
 APP.renderPage();
};
window.rejectVillager = function(regId) {
 if(!confirm('确定拒绝该村民申请？')) return;
 var regs = APP.Storage.get('registrations', []);
 for(var i=0;i<regs.length;i++){
 if(regs[i].id === regId){
 regs[i].status = '已拒绝';
 regs[i].reviewTime = Date.now();
 break;
 }
 }
 APP.Storage.set('registrations', regs);
 APP.toast('已拒绝');
 APP.renderPage();
};

// 村庄弹窗相关
var _villageIsCreate = false;
var _villageImages = [];
var _villageScenery = [];
var SCENERY_CATS = [
 { key: "湖", label: "湖", icon: "🌊", color: "#1565C0" },
 { key: "山", label: "山", icon: "⛰️", color: "#5D4037" },
 { key: "河", label: "河", icon: "🏞️", color: "#00838F" },
 { key: "树林", label: "树林", icon: "🌲", color: "#2E7D32" },
 { key: "农村风貌", label: "农村风貌", icon: "🌾", color: "#F57F17" }
];

window.openVillageModal = function(isCreate) {
 _villageIsCreate = isCreate;
 var data = null;
 if(!isCreate){
 var villages = APP.Storage.get('villages', []);
 for(var i=0;i<villages.length;i++){
 if(villages[i].chief && villages[i].chief.name === APP.user.currentRoleName){
 data = villages[i]; break;
 }
 }
 }
 _villageImages = data && data.images ? JSON.parse(JSON.stringify(data.images)) : [];
 _villageScenery = data && data.scenery ? JSON.parse(JSON.stringify(data.scenery)) : [];

 var v = data || {};
 var html = '<div class="modal-overlay" id="villageModal" onclick="closeVillageModal(event)">' +
 '<div class="modal-box" onclick="event.stopPropagation()">' +
 '<div class="modal-title">' + (isCreate ? '🏡 创建村庄' : '✏️ 编辑村庄信息') + '</div>' +
 '<div class="modal-form-group"><label class="modal-label"><span class="req">*</span> 村庄名称</label><input class="modal-input" id="vf_name" value="' + (v.name||'') + '" placeholder="请输入村庄名称"></div>' +
 '<div class="modal-form-group"><label class="modal-label">省份</label><input class="modal-input" id="vf_province" value="' + (v.province||'') + '" placeholder="如：江苏省"></div>' +
 '<div class="modal-form-group"><label class="modal-label">城市</label><input class="modal-input" id="vf_city" value="' + (v.city||'') + '" placeholder="如：苏州市"></div>' +
 '<div class="modal-form-group"><label class="modal-label">人口（人）</label><input class="modal-input" id="vf_population" value="' + (v.population||'') + '" placeholder="如：1200"></div>' +
 '<div class="modal-form-group"><label class="modal-label">总面积（亩）</label><input class="modal-input" id="vf_totalArea" value="' + (v.totalArea||'') + '" placeholder="如：5000"></div>' +
 '<div class="modal-form-group"><label class="modal-label">农田面积（亩）</label><input class="modal-input" id="vf_farmlandArea" value="' + (v.farmlandArea||'') + '" placeholder="如：3000"></div>' +
 '<div class="modal-form-group"><label class="modal-label">村委地址</label><input class="modal-input" id="vf_address" value="' + (v.address||'') + '" placeholder="村委办公地址"></div>' +
 '<div class="modal-form-group"><label class="modal-label">村长电话</label><input class="modal-input" id="vf_phone" value="' + ((v.chief && v.chief.phone)||'') + '" placeholder="联系电话"></div>' +
 '<div class="modal-form-group"><label class="modal-label">村庄简介</label><textarea class="modal-textarea" id="vf_description" placeholder="介绍村庄特色、产业等">' + (v.description||'') + '</textarea></div>' +
 '<div class="modal-form-group">' +
 '<label class="modal-label">村庄图片（最多6张）</label>' +
 '<input type="file" accept="image/*" multiple id="vf_images" onchange="previewVillageImages()" style="display:none">' +
 '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;" id="vf_imagePreview"></div>' +
 '<button type="button" onclick="document.getElementById('vf_images').click()" style="margin-top:8px;padding:8px 16px;background:#f5f5f5;color:#666;border:none;border-radius:8px;font-size:13px;cursor:pointer">📷 选择图片</button>' +
 '</div>' +
 '<div style="margin-top:16px;padding-top:16px;border-top:2px solid #E8F5E9;">' +
 '<div style="font-size:15px;font-weight:bold;color:#2E7D32;margin-bottom:12px;">🏞️ 风景图片管理</div>' +
 '<div id="vf_scenerySections"></div>' +
 '</div>' +
 '<button class="modal-btn modal-btn-save" onclick="saveVillage()">💾 保存</button>' +
 '<button class="modal-btn modal-btn-cancel" onclick="closeVillageModal()">取消</button>' +
 '</div></div>';
 var wrapper = document.createElement('div');
 wrapper.id = 'villageModalWrapper';
 wrapper.innerHTML = html;
 document.body.appendChild(wrapper);
 setTimeout(function(){ renderVillageImagePreview(); renderScenerySections(); }, 100);
};
window.closeVillageModal = function(e) {
 if(e && e.target.id !== 'villageModal') return;
 var w = document.getElementById('villageModalWrapper');
 if(w) w.remove();
};
window.previewVillageImages = function(){
 var files = document.getElementById('vf_images').files;
 if(!files || !files.length) return;
 var max = 6;
 if(_villageImages.length + files.length > max){
 APP.toast('最多上传6张图片'); return;
 }
 for(var fi=0;fi<files.length;fi++){
 (function(file){
 var reader = new FileReader();
 reader.onload = function(ev){
 var img = new Image();
 img.onload = function(){
 var w = img.width, h = img.height;
 var maxDim = 800;
 if(w>maxDim || h>maxDim){
 if(w>h){ h = h*maxDim/w; w=maxDim; }
 else { w = w*maxDim/h; h=maxDim; }
 }
 var canvas = document.createElement('canvas');
 canvas.width = w; canvas.height = h;
 canvas.getContext('2d').drawImage(img,0,0,w,h);
 var dataUrl = canvas.toDataURL('image/jpeg',0.7);
 if(dataUrl.length>200000) dataUrl = canvas.toDataURL('image/jpeg',0.5);
 _villageImages.push(dataUrl);
 renderVillageImagePreview();
 };
 img.src = ev.target.result;
 };
 reader.readAsDataURL(file);
 })(files[fi]);
 }
};
window.renderVillageImagePreview = function(){
 var preview = document.getElementById('vf_imagePreview');
 if(!preview) return;
 var html = '';
 _villageImages.forEach(function(img,i){
 html += '<div style="position:relative;display:inline-block;margin:4px;">' +
 '<img src="' + img + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid #e0e0e0;">' +
 '<div onclick="removeVillageImg(' + i + ')" style="position:absolute;top:-8px;right:-8px;background:#F44336;color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;">×</div>' +
 '</div>';
 });
 preview.innerHTML = html;
};
window.removeVillageImg = function(idx){
 _villageImages.splice(idx,1);
 renderVillageImagePreview();
};
window.renderScenerySections = function(){
 var sceneryEl = document.getElementById("vf_scenerySections");
 if(!sceneryEl) return;
 var html = "";
 SCENERY_CATS.forEach(function(cat){
 var items = _villageScenery.filter(function(s){ return s.category === cat.key; });
 html += '<div style="background:#FAFAFA;border:1px solid #E0E0E0;border-radius:12px;padding:12px;margin-bottom:12px;">' +
 '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
 '<span style="font-size:14px;font-weight:bold;color:' + cat.color + ';">' + cat.icon + ' ' + cat.label + '</span>' +
 '<button onclick="addSceneryToCat('' + cat.key + '')" style="padding:4px 10px;background:' + cat.color + ';color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;">＋ 添加</button>' +
 '</div>';
 if(items.length === 0){
 html += '<div style="text-align:center;color:#bbb;font-size:12px;padding:8px 0;">暂无' + cat.label + '图片</div>';
 }else{
 html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">';
 items.forEach(function(item){
 var gi = _villageScenery.indexOf(item);
 html += '<div style="position:relative;border-radius:8px;overflow:hidden;background:#e8f5e9;">' +
 (item.img ? '<img src="' + item.img + '" style="width:100%;height:80px;object-fit:cover;">' : '<div style="width:100%;height:80px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:24px;">' + cat.icon + '</div>') +
 '<div style="font-size:11px;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (item.title||"未命名") + '</div>' +
 '<div style="position:absolute;top:2px;right:2px;display:flex;gap:2px;">' +
 '<span onclick="editSceneryAt(' + gi + ')" style="background:rgba(255,255,255,0.9);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;">✏️</span>' +
 '<span onclick="removeSceneryAt(' + gi + ')" style="background:rgba(255,255,255,0.9);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;">×</span>' +
 '</div></div>';
 });
 html += '</div>';
 }
 html += '</div>';
 });
 sceneryEl.innerHTML = html;
};
window.addSceneryToCat = function(catKey){ openSceneryForm(-1, catKey); };
window.editSceneryAt = function(idx){ openSceneryForm(idx, null); };
window.removeSceneryAt = function(idx){
 if(!confirm("确定删除这个风景？")) return;
 _villageScenery.splice(idx,1);
 renderScenerySections();
};
var _sceneryTmpImg = "";
window.openSceneryForm = function(idx, defaultCat){
 var isNew = idx < 0;
 var s = isNew ? {} : (_villageScenery[idx] || {});
 if(isNew && defaultCat) s.category = defaultCat;
 var catOptions = "";
 SCENERY_CATS.forEach(function(cat){
 var selected = (s.category === cat.key) ? "selected" : "";
 catOptions += '<option value="' + cat.key + '" ' + selected + '>' + cat.icon + ' ' + cat.label + '</option>';
 });
 var formHtml = '<div class="modal-overlay" id="sceneryModal" onclick="closeSceneryForm(event)">' +
 '<div class="modal-box" onclick="event.stopPropagation()">' +
 '<div class="modal-title">' + (isNew ? "➕ 添加风景" : "✏️ 编辑风景") + '</div>' +
 '<div class="modal-form-group"><label class="modal-label"><span class="req">*</span> 风景名称</label><input class="modal-input" id="sf_title" value="' + (s.title||"") + '" placeholder="如：千年古银杏"></div>' +
 '<div class="modal-form-group"><label class="modal-label">简介</label><input class="modal-input" id="sf_desc" value="' + (s.desc||"") + '" placeholder="简短描述"></div>' +
 '<div class="modal-form-group"><label class="modal-label">分类</label><select class="modal-input" id="sf_category">' + catOptions + '</select></div>' +
 '<div class="modal-form-group">' +
 '<label class="modal-label">图片</label>' +
 '<input type="file" accept="image/*" id="sf_imgFile" onchange="previewSceneryImg()" style="display:none">' +
 '<div id="sf_imgPreview" style="margin-top:6px;"></div>' +
 (s.img ? '<img src="' + s.img + '" id="sf_currentImg" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-bottom:6px;">' : '') +
 '<button type="button" onclick="document.getElementById('sf_imgFile').click()" style="padding:6px 14px;background:#f5f5f5;border:none;border-radius:6px;font-size:12px;cursor:pointer;">📷 ' + (s.img ? "更换图片" : "上传图片") + '</button>' +
 '</div>' +
 '<div style="display:flex;gap:8px;margin-top:16px;">' +
 '<button class="modal-btn modal-btn-save" onclick="saveSceneryItem(' + idx + ')">💾 保存</button>' +
 '<button class="modal-btn modal-btn-cancel" onclick="closeSceneryForm()">取消</button>' +
 '</div></div></div>';
 var wrapper = document.createElement("div");
 wrapper.id = "sceneryModalWrapper";
 wrapper.innerHTML = formHtml;
 document.body.appendChild(wrapper);
 _sceneryTmpImg = s.img || null;
};
window.closeSceneryForm = function(e){
 if(e && e.target && e.target.id !== "sceneryModal") return;
 var w = document.getElementById("sceneryModalWrapper");
 if(w) w.remove();
};
window.previewSceneryImg = function(){
 var fileInput = document.getElementById("sf_imgFile");
 if (!fileInput.files || !fileInput.files.length) return;
 var file = fileInput.files[0];
 var reader = new FileReader();
 reader.onload = function(ev){
 var img = new Image();
 img.onload = function(){
 var w = img.width, h = img.height;
 var maxW = 800, maxH = 600;
 if(w>maxW || h>maxH){
 var ratio = Math.min(maxW/w, maxH/h);
 w = Math.round(w*ratio); h = Math.round(h*ratio);
 }
 var canvas = document.createElement("canvas");
 canvas.width = w; canvas.height = h;
 canvas.getContext("2d").drawImage(img,0,0,w,h);
 _sceneryTmpImg = canvas.toDataURL("image/jpeg",0.7);
 var preview = document.getElementById("sf_imgPreview");
 if(preview) preview.innerHTML = '<img src="' + _sceneryTmpImg + '" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;">';
 var cur = document.getElementById("sf_currentImg");
 if(cur) cur.style.display = "none";
 };
 img.src = ev.target.result;
 };
 reader.readAsDataURL(file);
};
window.saveSceneryItem = function(idx){
 var title = document.getElementById("sf_title").value.trim();
 if(!title){ APP.toast("请输入风景名称"); return; }
 var item = {
 id: "s_" + Date.now(),
 title: title,
 desc: document.getElementById("sf_desc").value.trim(),
 category: document.getElementById("sf_category").value,
 img: _sceneryTmpImg || ""
 };
 if(idx >= 0 && _villageScenery[idx]){
 item.id = _villageScenery[idx].id || item.id;
 _villageScenery[idx] = item;
 }else{
 _villageScenery.push(item);
 }
 closeSceneryForm();
 renderScenerySections();
};
window.saveVillage = function(){
 var name = document.getElementById('vf_name').value.trim();
 if(!name){ APP.toast('请输入村庄名称'); return; }
 var villages = APP.Storage.get('villages', []);
 if(_villageIsCreate){
 villages.push({
 id: 'v_' + Date.now(),
 name: name,
 province: document.getElementById('vf_province').value.trim(),
 city: document.getElementById('vf_city').value.trim(),
 population: document.getElementById('vf_population').value.trim(),
 totalArea: document.getElementById('vf_totalArea').value.trim(),
 farmlandArea: document.getElementById('vf_farmlandArea').value.trim(),
 address: document.getElementById('vf_address').value.trim(),
 description: document.getElementById('vf_description').value.trim(),
 chief: { name: APP.user.currentRoleName || APP.user.account, phone: document.getElementById('vf_phone').value.trim() },
 images: _villageImages || [],
 scenery: _villageScenery || [],
 createTime: Date.now()
 });
 APP.toast('村庄创建成功！');
 }else{
 var targetIdx = -1;
 for(var i=0;i<villages.length;i++){
 if(villages[i].chief && villages[i].chief.name === APP.user.currentRoleName){
 targetIdx = i; break;
 }
 }
 if(targetIdx === -1){ APP.toast('未找到村庄'); return; }
 villages[targetIdx].name = name;
 villages[targetIdx].province = document.getElementById('vf_province').value.trim();
 villages[targetIdx].city = document.getElementById('vf_city').value.trim();
 villages[targetIdx].population = document.getElementById('vf_population').value.trim();
 villages[targetIdx].totalArea = document.getElementById('vf_totalArea').value.trim();
 villages[targetIdx].farmlandArea = document.getElementById('vf_farmlandArea').value.trim();
 villages[targetIdx].address = document.getElementById('vf_address').value.trim();
 villages[targetIdx].description = document.getElementById('vf_description').value.trim();
 villages[targetIdx].chief.phone = document.getElementById('vf_phone').value.trim();
 villages[targetIdx].images = _villageImages || [];
 villages[targetIdx].scenery = _villageScenery || [];
 APP.toast('村庄信息已更新！');
 }
 APP.Storage.set('villages', villages);
 closeVillageModal();
 APP.renderPage();
};

// 按摩师编辑
window.openMassageEditModal = function(){
 var regs = APP.Storage.get('registrations', []);
 var myReg = null, myIdx = -1;
 for(var i=0;i<regs.length;i++){
 if(regs[i].accountId === APP.user.id && (regs[i].role === '按摩师' || regs[i].role === '按摩技师') && regs[i].status === '已通过'){
 myReg = regs[i]; myIdx = i; break;
 }
 }
 if(!myReg){ APP.toast('未找到技师资料'); return; }
 var html = '<div class="modal-overlay" id="massageEditModal" onclick="closeMassageEditModal(event)">' +
 '<div class="modal-box" onclick="event.stopPropagation()">' +
 '<div class="modal-title">编辑我的资料</div>' +
 '<div style="text-align:center;margin-bottom:16px;">' +
 '<img id="massagePhotoPreview" src="' + (myReg.photo||'') + '" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #E91E63;background:#FCE4EC;">' +
 '<div style="margin-top:8px;">' +
 '<label style="display:inline-block;padding:6px 14px;background:#E91E63;color:white;border-radius:16px;font-size:12px;cursor:pointer;">更换照片' +
 '<input type="file" accept="image/*" id="massagePhotoInput" onchange="previewMassagePhoto(this)" style="display:none">' +
 '</label></div></div>' +
 '<div class="modal-form-group"><label class="modal-label">联系电话</label><input class="modal-input" type="tel" id="editMassagePhone" value="' + (myReg.phone||'') + '" placeholder="请输入联系电话"></div>' +
 '<div class="modal-form-group"><label class="modal-label">当前地址</label><input class="modal-input" type="text" id="editMassageAddress" value="' + (myReg.curAddress||'') + '" placeholder="请输入当前地址"></div>' +
 '<div class="modal-form-group"><label class="modal-label">擅长项目</label><input class="modal-input" type="text" id="editMassageSkill" value="' + (myReg.skill||'') + '" placeholder="如：足疗、推拿、艾灸"></div>' +
 '<div class="modal-form-group"><label class="modal-label">从业年限</label><input class="modal-input" type="text" id="editMassageYears" value="' + (myReg.years||'') + '" placeholder="如：5年"></div>' +
 '<button class="modal-btn modal-btn-save" onclick="saveMassageEdit(' + myIdx + ')">保存修改</button>' +
 '<button class="modal-btn modal-btn-cancel" onclick="closeMassageEditModal()">取消</button>' +
 '</div></div>';
 var wrapper = document.createElement('div');
 wrapper.id = 'massageEditWrapper';
 wrapper.innerHTML = html;
 document.body.appendChild(wrapper);
 window._massageNewPhoto = myReg.photo || '';
};
window.closeMassageEditModal = function(e){
 if(e && e.target.id !== 'massageEditModal') return;
 var w = document.getElementById('massageEditWrapper');
 if(w) w.remove();
};
window.previewMassagePhoto = function(input){
 if (!input.files || !input.files[0]) return;
 var file = input.files[0];
 var reader = new FileReader();
 reader.onload = function(e){
 var img = new Image();
 img.onload = function(){
 var canvas = document.createElement('canvas');
 var w = img.width, h = img.height;
 var maxW = 800, maxH = 600;
 if(w>maxW){ h = h*maxW/w; w = maxW; }
 if(h>maxH){ w = w*maxH/h; h = maxH; }
 canvas.width = w; canvas.height = h;
 canvas.getContext('2d').drawImage(img,0,0,w,h);
 window._massageNewPhoto = canvas.toDataURL('image/jpeg',0.7);
 document.getElementById('massagePhotoPreview').src = window._massageNewPhoto;
 };
 img.src = e.target.result;
 };
 reader.readAsDataURL(file);
};
window.saveMassageEdit = function(idx){
 var newPhone = document.getElementById('editMassagePhone').value.trim();
 var newAddress = document.getElementById('editMassageAddress').value.trim();
 var newSkill = document.getElementById('editMassageSkill').value.trim();
 var newYears = document.getElementById('editMassageYears').value.trim();
 if(newPhone && !/^1\d{10}$/.test(newPhone)){ APP.toast('请输入正确的手机号'); return; }
 var regs = APP.Storage.get('registrations', []);
 regs[idx].phone = newPhone;
 regs[idx].curAddress = newAddress;
 regs[idx].skill = newSkill;
 regs[idx].years = newYears;
 if(window._massageNewPhoto) regs[idx].photo = window._massageNewPhoto;
 APP.Storage.set('registrations', regs);
 APP.toast('保存成功');
 closeMassageEditModal();
 APP.renderPage();
};

// 联系方式编辑
window.openEditContactModal = function(){
 var user = APP.Storage.get('user');
 document.getElementById('editPhone').value = user.phone || '';
 document.getElementById('editAddress').value = user.address || '';
 document.getElementById('editContactModal').style.display = 'flex';
};
window.closeEditContactModal = function(){
 document.getElementById('editContactModal').style.display = 'none';
};
window.saveContactInfo = function(){
 var phone = document.getElementById('editPhone').value.trim();
 var address = document.getElementById('editAddress').value.trim();
 if (!phone) { APP.toast('请输入联系电话'); return; }
 if (!/^1[3-9]\d{9}$/.test(phone)) { APP.toast('手机号码格式不正确'); return; }
 var user = APP.Storage.get('user');
 user.phone = phone;
 user.address = address;
 APP.Storage.set('user', user);
 var accounts = APP.Storage.get('accounts', []);
 for(var i=0;i<accounts.length;i++){
 if(accounts[i].id === user.id){
 accounts[i].phone = phone;
 accounts[i].address = address; break;
 }
 }
 APP.Storage.set('accounts', accounts);
 closeEditContactModal();
 APP.toast('保存成功！');
 APP.renderPage();
};

// 退出登录
window.doLogout = function(){
 if(!confirm('确定退出登录？')) return;
 APP.Storage.set('user', null);
 location.href = 'login.html';
};

// 页面启动
try {
 renderPage();
} catch(e) {
 document.getElementById('mainContent').innerHTML = '<div style="padding:20px;color:red;">页面加载失败：' + e.message + '</div>';
}
</script>
