<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据流诊断工具 (Gist版)</title>
<style>
body{font-family:monospace;padding:20px;background:#1a1a1a;color:#0f0;font-size:12px}
.section{background:#000;border:1px solid #0f0;padding:15px;margin:15px 0}
h2{color:#0f0;border-bottom:1px solid #0f0;padding-bottom:10px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #333}
.label{color:#888}
.value{color:#0f0;word-break:break-all}
.ok{color:#0f0}
.warn{color:#ff0}
.error{color:#f00}
.btn{background:#0f0;color:#000;border:none;padding:10px 20px;cursor:pointer;margin:5px;font-family:monospace}
.btn:hover{background:#0a0}
pre{background:#111;padding:10px;overflow-x:auto;max-height:300px;overflow-y:auto}
input[type=text],input[type=password]{background:#000;color:#0f0;border:1px solid #0f0;padding:5px;width:300px;font-family:monospace;margin:3px}
</style>
</head>
<body>
<h1>数据流诊断工具 (Gist版)</h1>

<div class="section">
<h2>0. Gist Token 配置</h2>
<div>当前 Token: <span id="tokenStatus" class="label">未配置</span></div>
<input type="password" id="tokenInput" placeholder="粘贴新 Token (ghp_...)">
<button class="btn" onclick="saveToken()">保存 Token</button>
<button class="btn" onclick="clearToken()">清除 Token</button>
</div>

<div class="section">
<h2>1. 本地 localStorage 数据</h2>
<div id="localData"></div>
<button class="btn" onclick="showLocalData()">刷新本地数据</button>
</div>

<div class="section">
<h2>2. Gist 云端数据</h2>
<div id="cloudData"></div>
<button class="btn" onclick="fetchCloudData()">刷新云端数据</button>
</div>

<div class="section">
<h2>3. 上传/下载/清空</h2>
<button class="btn" onclick="uploadLocal()">📤 上传本地到云端</button>
<button class="btn" onclick="downloadCloud()">📥 下载云端到本地</button>
<button class="btn" onclick="clearLocal()">🗑️ 清空本地数据</button>
</div>

<div class="section">
<h2>4. 日志</h2>
<pre id="log"></pre>
</div>

<script>
/* GistDB inline (token-free) */
(function(){
  var GIST_ID='ed0e2614049e613d382f94458d9022f1';
  var OWNER='chenhaijun770528';
  var RAW_BASE='https://gist.githubusercontent.com/'+OWNER+'/'+GIST_ID+'/raw';
  var API_BASE='https://api.github.com/gists/'+GIST_ID;
  var _cache={};
  var _cbs=[];
  var _ready=false;
  var _version=null;

  function getToken(){return localStorage.getItem('gist_token')||'';}

  function init(cb){
    _cbs.push(cb);
    if(_ready){setTimeout(runCbs,0);return;}
    fetchGist(function(gist){
      if(!gist||!gist.files){runCbs();return;}
      _cache={};
      for(var fn in gist.files){
        var f=gist.files[fn];
        if(f.content!==undefined){
          try{_cache[fn]=JSON.parse(f.content);}catch(e){_cache[fn]=f.content;}
        }
      }
      _version=gist.version;
      _ready=true;
      runCbs();
    });
  }
  function runCbs(){var c=_cbs.splice(0);for(var i=0;i<c.length;i++){try{c[i](_cache);}catch(e){}}}
  function get(key,cb){
    if(cb){fetchFile(key,function(d){_cache[key]=d;cb(d);});}
    return _cache[key];
  }
  function set(key,data,cb){
    _cache[key]=data;save(key,cb);
  }
  function save(key,cb){
    var body={description:'Village H5 Database',files:{}};
    body.files[key]={content:JSON.stringify(_cache[key],null,2)};
    var x=new XMLHttpRequest();
    x.open('PATCH',API_BASE,true);
    x.setRequestHeader('Authorization','Bearer '+getToken());
    x.setRequestHeader('Content-Type','application/json');
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status===200){
          var r=JSON.parse(x.responseText);
          _version=r.version;
          for(var fn in r.files){
            var f=r.files[fn];
            if(f.content!==undefined){try{_cache[fn]=JSON.parse(f.content);}catch(e){_cache[fn]=f.content;}}
          }
          if(cb)cb({ok:true,version:_version});
        }else{
          console.error('GistDB save error:',x.status);
          if(cb)cb({ok:false,error:x.status,response:x.responseText});
        }
      }
    };
    x.send(JSON.stringify(body));
  }
  function fetchGist(cb){
    var x=new XMLHttpRequest();
    x.open('GET',API_BASE,true);
    x.setRequestHeader('Authorization','Bearer '+getToken());
    x.setRequestHeader('Accept','application/json');
    x.onreadystatechange=function(){
      if(x.readyState===4&&x.status===200){try{cb(JSON.parse(x.responseText));}catch(e){cb(null);}}
      else if(x.readyState===4){cb(null);}
    };
    x.send();
  }
  function fetchFile(key,cb){
    var x=new XMLHttpRequest();
    x.open('GET',RAW_BASE+'/'+key+'?t='+Date.now(),true);
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status===200){try{cb(JSON.parse(x.responseText));}catch(e){cb(x.responseText);}}
        else{cb(null);}
      }
    };
    x.send();
  }
  window.GistDB={init:init,get:get,set:set,ready:function(){return _ready;}};
})();

var KEYS = ['accounts','registrations','villages','products','foods','camps','announcements'];

function log(msg) {
  var el = document.getElementById('log');
  var time = new Date().toLocaleTimeString();
  el.textContent = '[' + time + '] ' + msg + '\n' + el.textContent;
  console.log(msg);
}

function saveToken() {
  var t = document.getElementById('tokenInput').value.trim();
  if (!t) { log('Token 为空'); return; }
  localStorage.setItem('gist_token', t);
  document.getElementById('tokenStatus').textContent = '已配置 (' + t.substring(0,8) + '...)';
  log('✅ Token 已保存');
}

function clearToken() {
  localStorage.removeItem('gist_token');
  document.getElementById('tokenStatus').textContent = '未配置';
  log('Token 已清除');
}

function showLocalData() {
  var el = document.getElementById('localData');
  var html = '';
  KEYS.forEach(function(k) {
    var v = localStorage.getItem('village_' + k) || localStorage.getItem(k);
    var count = 0;
    if (v) { try { count = JSON.parse(v).length || 0; } catch(e) { count = -1; } }
    html += '<div class="row"><span class="label">' + k + '</span><span class="value">' + (v ? count + ' 条' : '∅') + '</span></div>';
  });
  el.innerHTML = html;
}

function fetchCloudData() {
  var t = localStorage.getItem('gist_token');
  if (!t) {
    log('❌ 请先配置 Token');
    document.getElementById('cloudData').innerHTML = '<div class="error">未配置 Token</div>';
    return;
  }
  log('正在拉取云端数据...');
  GistDB.init(function(cache) {
    var el = document.getElementById('cloudData');
    var html = '<div class="row"><span class="label">版本</span><span class="value">' + (cache._version || '?') + '</span></div>';
    KEYS.forEach(function(k) {
      var d = cache[k];
      var count = 0;
      if (d && Array.isArray(d)) count = d.length;
      else if (d && typeof d === 'object') count = Object.keys(d).length;
      html += '<div class="row"><span class="label">' + k + '</span><span class="value">' + count + ' 条</span></div>';
    });
    el.innerHTML = html;
    log('✅ 云端数据已加载');
  });
}

function uploadLocal() {
  if (!confirm('确定把本地数据上传到云端 Gist？这会覆盖云端现有数据！')) return;
  var t = localStorage.getItem('gist_token');
  if (!t) { log('❌ 请先配置 Token'); return; }
  log('开始上传本地到云端...');

  var data = {};
  KEYS.forEach(function(k) {
    var v = localStorage.getItem('village_' + k) || localStorage.getItem(k);
    if (v) {
      try { data[k] = JSON.parse(v); } catch(e) { data[k] = []; }
    } else {
      data[k] = [];
    }
  });

  var i = 0;
  function pushNext() {
    if (i >= KEYS.length) {
      log('✅ 全部数据上传完成');
      fetchCloudData();
      return;
    }
    var k = KEYS[i];
    log('推送 ' + k + ' (' + data[k].length + ' 条)...');
    GistDB.set(k, data[k], function(r) {
      if (r && r.ok) {
        log('  ✅ ' + k + ' OK');
        i++;
        setTimeout(pushNext, 500);
      } else {
        log('  ❌ ' + k + ' 失败: ' + (r ? r.error : 'unknown'));
        i++;
        setTimeout(pushNext, 500);
      }
    });
  }
  pushNext();
}

function downloadCloud() {
  var t = localStorage.getItem('gist_token');
  if (!t) { log('❌ 请先配置 Token'); return; }
  log('开始下载云端到本地...');
  GistDB.init(function(cache) {
    KEYS.forEach(function(k) {
      if (cache[k] !== undefined) {
        localStorage.setItem('village_' + k, JSON.stringify(cache[k]));
        log('  ✅ ' + k + ' (' + (Array.isArray(cache[k]) ? cache[k].length : 'obj') + ')');
      }
    });
    log('✅ 云端数据已下载到本地');
    showLocalData();
  });
}

function clearLocal() {
  if (!confirm('确定清空本地所有 village_ 数据？')) return;
  KEYS.forEach(function(k) {
    localStorage.removeItem('village_' + k);
    localStorage.removeItem(k);
  });
  log('本地数据已清空');
  showLocalData();
}

window.addEventListener('load', function() {
  var t = localStorage.getItem('gist_token');
  if (t) {
    document.getElementById('tokenStatus').textContent = '已配置 (' + t.substring(0,8) + '...)';
    document.getElementById('tokenInput').placeholder = '已保存，新 Token 粘贴后点保存';
  }
  showLocalData();
});
</script>
</body>
</html>
